name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Compile Tweak
        env:
          THEOS: ${{ HOME }}/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make clean
          make FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtourAdFree-dylib
          path: .theos/obj/*.dylib
